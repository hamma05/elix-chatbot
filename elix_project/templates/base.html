{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Elix Chatbot{% endblock %}</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .main-container {
            padding-top: 2rem;
        }
        .navbar-brand {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .navbar-logo {
            width: 70px;
            height: 35px;
            object-fit: contain;
        }
    </style>
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'chat' %}">
                <img class="navbar-logo" src="{% static 'images/elix.png' %}" alt="Elix logo">
                <span>Chatbot</span>
            </a>
            
            {% if user.is_authenticated %}
            <div class="navbar-nav ms-auto">
                <span class="navbar-text text-white me-3">
                    Welcome, {{ user.username }}
                </span>
                <a class="btn btn-outline-light btn-sm" href="{% url 'logout' %}">Logout</a>
            </div>
            {% endif %}
        </div>
    </nav>
    
    <!-- Main Content -->
    <div class="container main-container">
        {% block content %}{% endblock %}
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    {% block extra_js %}
  
    {% endblock %}
</body>
</html>
